```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050505">

    <title>Loading...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            color: #d6b77a;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .loader-container {
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .loader {
            width: 65px;
            height: 65px;
            border: 2px solid rgba(214, 183, 122, 0.12);
            border-top: 2px solid #d6b77a;
            border-radius: 50%;
            margin: 0 auto 35px;
            animation: rotate 1s linear infinite;
            box-shadow: 0 0 20px rgba(214, 183, 122, 0.08);
        }

        h2 {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 35px;
        }

        .progress-container {
            width: 100%;
            height: 2px;
            background: #242424;
            overflow: hidden;
            border-radius: 10px;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #d6b77a;
            box-shadow: 0 0 12px #d6b77a;
            transition: width 0.1s linear;
        }

        .percentage {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            color: #777;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .percentage span:last-child {
            color: #d6b77a;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .loader-container {
                max-width: 300px;
            }

            h2 {
                font-size: 11px;
                letter-spacing: 4px;
            }
        }
    </style>
</head>

<body>

    <main class="loader-container">

        <div class="loader"></div>

        <h2>Loading Experience</h2>

        <p class="subtitle" id="status">
            Preparing everything for you...
        </p>

        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <div class="percentage">
            <span>PLEASE WAIT</span>
            <span id="percent">0%</span>
        </div>

    </main>

    <script>
        const progress = document.getElementById("progress");
        const percent = document.getElementById("percent");
        const status = document.getElementById("status");

        let value = 0;

        const messages = [
            "Preparing everything for you...",
            "Initializing components...",
            "Almost there...",
            "Finalizing experience..."
        ];

        const interval = setInterval(() => {

            value += Math.floor(Math.random() * 3) + 1;

            if (value >= 100) {
                value = 100;
                clearInterval(interval);
                status.textContent = "Ready!";
            }

            progress.style.width = value + "%";
            percent.textContent = value + "%";

            if (value >= 30 && value < 60) {
                status.textContent = messages[1];
            } else if (value >= 60 && value < 90) {
                status.textContent = messages[2];
            } else if (value >= 90 && value < 100) {
                status.textContent = messages[3];
            }

        }, 100);

    </script>

</body>
</html>
